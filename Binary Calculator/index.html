<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/binaryCalculator.css">
    <title>BinaryCalculator</title>
</head>
<body>
    <div class="container">
        <div class="screen" id="display">
        </div>
        <div class="numButtons">
            <button id = "btn0">0</button>
            <button id = "btn1">1</button>
            <button id = "btnC">c</button>
            <button id = "btnE">=</button>
        </div>
        <div class="opButtons">
            <button id = "btnAdd">+</button>
            <button id = "btnSub">-</button>
            <button id = "btnMul">*</button>
            <button id = "btnDiv">/</button>
        </div>
    </div>
    <script src="./js/binaryCalculator.js"></script>
</body>
</html>
